services:
    syncchat.api:
        image: ${DOCKER_REGISTRY-}syncchatapi
        build:
          context: .
          dockerfile: SyncChat.API/Dockerfile
        ports:
            - "5000:5000"
            - "5001:5001"
        environment:
            - ASPNETCORE_ENVIRONMENT=Development
        volumes:
          - /mnt/c/Users/User/SyncChat/SyncChat.API:/app
        restart: unless-stopped

    postgres:
        image: postgres:latest
        environment:
            POSTGRES_USER: syncchatuser
            POSTGRES_PASSWORD: syncchatpass
            POSTGRES_DB: syncchatdb
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        restart: unless-stopped

volumes:
  postgres_data: