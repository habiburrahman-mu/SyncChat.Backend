services:
    syncchat.api:
        image: ${DOCKER_REGISTRY-}syncchatapi
        build:
          context: .
          dockerfile: SyncChat.API/Dockerfile
        ports:
            - "5000:5000"
            - "5001:5001"
        environment:
            - ASPNETCORE_ENVIRONMENT=Development
            - AllowedHosts=*
            # Connection
            - ConnectionStrings__Default=Host=postgres;Database=syncchatdb;Username=syncchatuser;Password=syncchatpass
            # Logging
            - Logging__LogLevel__Default=Information
            - Logging__LogLevel__Microsoft.AspNetCore=Warning
            # JWT
            - JWT__AccessTokenSecret=b9w84#9dk@dkfj0293JSDK@39dkf#kd02kd9Wke
            - JWT__RefreshTokenSecret=f9w84@9dk#dkfja393BYjk@ABcdf#kd02kd9qSA
            - JWT__Issuer=SyncChat
            - JWT__Audience=SyncChatClient
            - JWT__AccessTokenExpirationInMinutes=10
            - JWT__RefreshTokenExpirationInMinutes=10080
            - JWT__PasswordResetUrlBase=http://localhost:4200/#/auth/reset-password
            - JWT__PasswordResetExpirationInMinutes=60
            - JWT__PasswordResetTokenSecret=l9w84@9dk-dkfja393BYjkQABcdfPkd02kd9qSA
            # Google Auth
            # - GoogleAuth__ClientId=YOUR_GOOGLE_CLIENT
            # Storage
            - Storage__Endpoint=minio
            - Storage__Port=9000
            - Storage__AccessKey=minioadmin
            - Storage__SecretKey=minioadmin
            - Storage__Bucket=syncchat
            - Storage__UseSSL=false
            - Storage__PublicUrl=http://localhost:9000
            # Email
            # - Email__SmtpHost=smtp.example.com
            # - Email__SmtpPort=587
            # - Email__SmtpUser=Your_Provider_User_ID
            # - Email__SmtpPass=YOUR_API_KEY
            # - Email__From=Your_Domain_Address
        volumes:
            - /mnt/c/Users/User/SyncChat/SyncChat.API:/app
        depends_on:
            - postgres
            - minio
        networks:
            - syncchat-net
        restart: unless-stopped

    postgres:
        image: postgres:latest
        environment:
            POSTGRES_USER: syncchatuser
            POSTGRES_PASSWORD: syncchatpass
            POSTGRES_DB: syncchatdb
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - syncchat-net
        restart: unless-stopped

    minio:
        image: minio/minio:latest
        command: server /data --console-address ":9001"
        environment:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
          MINIO_SERVER_URL: http://localhost:9000
        ports:
          - "9000:9000"   # S3 API
          - "9001:9001"   # Admin Console
        volumes:
          - minio_data:/data
        networks:
          - syncchat-net
        restart: unless-stopped
          

volumes:
    postgres_data:
    minio_data:
  
networks:
    syncchat-net:
        driver: bridge